name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HF_SPACE: your-hf-account/your-space-name

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Check required files
        run: test -f app.py && test -f README.md && test -f requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py tests
      - name: Import application
        run: python -c "import app; print('import ok')"
      - name: Run tests
        run: pytest -q

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main